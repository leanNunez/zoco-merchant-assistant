[project]
name = "merchant-assistant"
version = "0.1.0"
description = "Conversational assistant for a ZocoTickets merchant: from-scratch hybrid retrieval, tool calling with code-enforced policies, and an AI-human control state machine."
authors = [
    { name = "lean", email = "lean.p.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

# --------------------------------------------------------------------------- tooling

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ bans the process clock (datetime.now() without tz, date.today()): time is injected.
# S is bandit; T20 bans stray print() outside the console adapter.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "DTZ", "PIE", "RET", "TID", "PERF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/merchant_assistant/cli/**" = ["T20"]
"evaluation/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# `-m "not network"` keeps a plain `pytest` from ever spending API credit. Run
# `pytest -m network` on purpose to exercise a real provider.
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra", "-m", "not network"]
filterwarnings = ["error"]
markers = [
    "integration: touches SQLite or the filesystem",
    "network: calls a real LLM or embeddings API (costs credit; never runs in CI)",
]

[tool.coverage.run]
source = ["merchant_assistant"]
branch = true

# --------------------------------------------------------------------------- architecture
# These contracts are the executable form of design/adr/0001. A rule that nothing
# checks erodes (it did in a previous project), so CI runs `lint-imports`.

[tool.importlinter]
root_package = "merchant_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Retrieval is built from scratch: Python, numpy and an embeddings API only (brief, Part 1)"
type = "forbidden"
source_modules = ["merchant_assistant"]
forbidden_modules = [
    "langchain", "langchain_core", "langchain_community", "langchain_openai", "llama_index",
    "sklearn", "scipy", "pandas", "rank_bm25", "bm25s", "whoosh", "pyserini", "haystack",
    "chromadb", "faiss", "pinecone", "qdrant_client", "weaviate", "lancedb", "pgvector",
    "sentence_transformers", "transformers", "torch", "nltk", "spacy",
]

[[tool.importlinter.contracts]]
name = "Capabilities do not know each other"
type = "independence"
modules = [
    "merchant_assistant.knowledge",
    "merchant_assistant.sales",
    "merchant_assistant.complaints",
    "merchant_assistant.control",
]

[[tool.importlinter.contracts]]
name = "The agent reaches capabilities through its own ports, never their implementations"
type = "forbidden"
source_modules = ["merchant_assistant.agent"]
forbidden_modules = [
    "merchant_assistant.knowledge",
    "merchant_assistant.sales",
    "merchant_assistant.complaints",
]

[[tool.importlinter.contracts]]
name = "Hexagonal layers inside the agent: adapters > application > ports > domain"
type = "layers"
layers = [
    "merchant_assistant.agent.adapters",
    "merchant_assistant.agent.application",
    "merchant_assistant.agent.ports",
    "merchant_assistant.agent.domain",
]

[[tool.importlinter.contracts]]
name = "Only the composition root and the console wire things together"
type = "forbidden"
source_modules = [
    "merchant_assistant.shared",
    "merchant_assistant.knowledge",
    "merchant_assistant.sales",
    "merchant_assistant.complaints",
    "merchant_assistant.control",
    "merchant_assistant.agent",
]
forbidden_modules = ["merchant_assistant.bootstrap", "merchant_assistant.cli"]

[[tool.importlinter.contracts]]
name = "shared is the base: it imports no other part of the system"
type = "forbidden"
source_modules = ["merchant_assistant.shared"]
forbidden_modules = [
    "merchant_assistant.knowledge",
    "merchant_assistant.sales",
    "merchant_assistant.complaints",
    "merchant_assistant.control",
    "merchant_assistant.agent",
]

[[tool.importlinter.contracts]]
name = "Pure domains perform no I/O and know no provider"
type = "forbidden"
source_modules = ["merchant_assistant.control", "merchant_assistant.agent.domain"]
forbidden_modules = ["openai", "httpx", "requests", "sqlite3"]

[[tool.importlinter.contracts]]
name = "The retrieval domain performs no I/O and knows no provider"
type = "forbidden"
source_modules = [
    "merchant_assistant.knowledge.documents",
    "merchant_assistant.knowledge.questions",
    "merchant_assistant.knowledge.text",
    "merchant_assistant.knowledge.chunking",
    "merchant_assistant.knowledge.errors",
]
forbidden_modules = [
    "merchant_assistant.knowledge.adapters",
    "openai",
    "httpx",
    "requests",
    "sqlite3",
]
